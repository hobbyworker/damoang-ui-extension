<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --fg: #1c1c1e;
    --muted: #8e8e93;
    --track-off: #d9d9de;
    --track-on: #34c759;
    --thumb: #ffffff;
    --divider: rgba(0, 0, 0, 0.06);
    --overlay: rgba(255, 255, 255, 0.45);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1e1e20;
      --fg: #f2f2f4;
      --muted: #98989e;
      --track-off: #3a3a3e;
      --divider: rgba(255, 255, 255, 0.08);
      --overlay: rgba(30, 30, 32, 0.5);
    }
  }
  /* 수동 다크. 위 블록과 값이 같아야 한다 */
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #1e1e20;
    --fg: #f2f2f4;
    --muted: #98989e;
    --track-off: #3a3a3e;
    --divider: rgba(255, 255, 255, 0.08);
    --overlay: rgba(30, 30, 32, 0.5);
  }
  :root[data-theme="light"] { color-scheme: light; }
  /* 로딩 전후 팝업 크기가 출렁이지 않도록 고정. 내용이 넘치면 패널 안에서 스크롤 */
  body {
    width: 520px;
    height: 560px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    margin: 0;
    padding: 6px 0 0;
    background: var(--bg);
    color: var(--fg);
    font: 13px/1.4 -apple-system, "Apple SD Gothic Neo", "Pretendard", system-ui, sans-serif;
    user-select: none;
  }
  /* display 지정된 요소에서도 hidden이 우선하도록 */
  [hidden] { display: none !important; }
  h1 {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.04em;
    color: var(--muted);
    margin: 6px 14px 4px;
  }
  /* 접을 수 있는 그룹 제목. 접으면 스위치 행만 숨고 그룹 버튼은 남는다 */
  .group-head {
    display: flex;
    align-items: center;
    cursor: pointer;
  }
  /* 그룹 제목 오른쪽 끝의 기능별 설정 버튼 */
  .head-btn {
    margin-left: auto;
    display: inline-flex;
    padding: 0;
    border: none;
    background: none;
    color: var(--muted);
    cursor: pointer;
  }
  .head-btn:hover { color: var(--fg); }
  .head-btn svg { width: 14px; height: 14px; }
  .group-head .chev {
    display: inline-block;
    width: 0;
    height: 0;
    border-left: 4px solid transparent;
    border-right: 4px solid transparent;
    border-top: 5px solid currentColor;
    margin-right: 6px;
    vertical-align: 1px;
    transition: transform 0.15s ease;
  }
  .collapsed .chev { transform: rotate(-90deg); }
  .group.collapsed .rows { display: none; }
  /* 팝업 상단부. 차단막은 이 영역까지만 덮고 하단 정보 줄은 남긴다 */
  #main {
    position: relative;
    display: flex;
    flex-direction: column;
    flex: 1;
    min-height: 0;
  }

  /* 좌우 패널. .panel을 추가하면 칼럼이 늘어난다 */
  #columns {
    display: flex;
    align-items: stretch;
    flex: 1;
    min-height: 0;
  }
  .panel {
    flex: 1 1 0;
    min-width: 0;
    overflow-y: auto;
  }
  .panel + .panel { border-left: 1px solid var(--divider); }

  .empty {
    padding: 7px 14px;
    color: var(--muted);
  }

  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 9px 14px;
  }
  .row + .row { border-top: 1px solid var(--divider); }
  .row label { flex: 1; cursor: pointer; }

  .switch { position: relative; display: inline-block; width: 34px; height: 20px; flex-shrink: 0; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch .track {
    position: absolute; inset: 0;
    background: var(--track-off);
    border-radius: 999px;
    transition: background 0.15s ease;
    cursor: pointer;
  }
  .switch .track::after {
    content: "";
    position: absolute; top: 2px; left: 2px;
    width: 16px; height: 16px;
    background: var(--thumb);
    border-radius: 50%;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.25);
    transition: transform 0.15s ease;
  }
  .switch input:checked + .track { background: var(--track-on); }
  .switch input:checked + .track::after { transform: translateX(14px); }
  .switch input:focus-visible + .track { outline: 2px solid var(--track-on); outline-offset: 2px; }
  .switch input:disabled + .track { opacity: 0.4; cursor: default; }

  /* 크기는 스위치 높이(20px)와 같게 잡아 교체 시 줄 높이가 안 흔들리게 */
  .spinner {
    display: inline-block;
    width: 16px;
    height: 16px;
    border: 2px solid var(--track-off);
    border-top-color: var(--muted);
    border-radius: 50%;
    animation: rotate 0.7s linear infinite;
    flex-shrink: 0;
  }
  h1 .spinner {
    width: 10px;
    height: 10px;
    margin-left: 6px;
    vertical-align: middle;
  }
  @keyframes rotate { to { transform: rotate(360deg); } }

  /* 다모앙 즐겨찾기처럼 2열 배치. 1 2 / 3 4 … 행 우선 순서 */
  #favorites {
    display: grid;
    grid-template-columns: 1fr 1fr;
  }
  .fav {
    padding: 9px 14px;
    cursor: pointer;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }
  .fav:hover { background: var(--divider); }
  .fav:active { opacity: 0.7; }
  .empty { grid-column: 1 / -1; }

  /* 즐겨찾기 칼럼. 목록은 스크롤, 다모앙 후원 링크는 하단 고정 */
  #fav-panel {
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  #favorites {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    scrollbar-gutter: stable;
    grid-auto-rows: max-content; /* 공간이 모자라도 행을 누르지 말고 스크롤 */
    align-content: start;
  }
  /* ::-webkit-scrollbar를 지정하면 오버레이 대신 항상 보이는 스크롤바가 된다 */
  #favorites::-webkit-scrollbar { width: 10px; }
  #favorites::-webkit-scrollbar-track { background: transparent; }
  #favorites::-webkit-scrollbar-thumb {
    background: var(--track-off);
    border-radius: 5px;
    border: 2px solid transparent;
    background-clip: padding-box;
  }
  #support {
    flex-shrink: 0;
    padding: 8px 14px;
    border-top: 1px solid var(--divider);
  }
  .support-link {
    display: flex;
    align-items: center;
    padding: 7px 12px;
    border: 1px solid var(--divider);
    border-radius: 999px;
    color: var(--fg);
    text-decoration: none;
  }
  .support-link + .support-link { margin-top: 8px; }
  .support-link:hover { background: var(--divider); }
  .support-link .arrow { margin-left: auto; color: var(--muted); }

  /* 설정 칼럼. 그룹들은 스크롤, 전역 버튼(적용·새로고침)은 하단 고정 */
  #settings {
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  #groups {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding-bottom: 10px;
  }

  .actions {
    display: flex;
    gap: 8px;
    margin: 10px 14px 0;
  }
  .actions button {
    flex: 1;
    padding: 6px 0;
    border-radius: 7px;
    border: 1px solid var(--divider);
    background: transparent;
    color: var(--fg);
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  #apply {
    background: var(--track-on);
    border-color: transparent;
    color: #fff;
  }
  .actions button:disabled { opacity: 0.4; cursor: default; }
  .actions button:not(:disabled):active { opacity: 0.75; }

  #global-actions {
    flex-shrink: 0;
    margin: 0;
    padding: 8px 14px;
    border-top: 1px solid var(--divider);
  }
  /* 그룹 전용 보조 버튼. 전역 버튼보다 가볍게 */
  .group-actions button {
    padding: 4px 0;
    font-size: 12px;
    font-weight: 500;
    color: var(--muted);
  }
  .group + .group {
    margin-top: 8px;
    border-top: 1px solid var(--divider);
  }

  /* 바로가기. 즐겨찾기 목록 아래 고정, 접으면 즐겨찾기가 그만큼 넓어진다 */
  #shortcut-group {
    flex-shrink: 0;
    padding-bottom: 6px;
    border-top: 1px solid var(--divider);
  }
  .sc-caption {
    font-size: 11px;
    color: var(--muted);
    margin: 8px 14px 2px;
  }
  .sc-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
  }
  .sc {
    padding: 5px 14px;
    cursor: pointer;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }
  .sc:hover { background: var(--divider); }
  .sc:active { opacity: 0.7; }

  #gate p,
  #fail p {
    margin: 0 0 14px;
    color: var(--muted);
  }
  #gate button,
  #fail button {
    width: 240px;
    padding: 7px 0;
    border-radius: 7px;
    border: none;
    background: var(--track-on);
    color: #fff;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  #gate button:not(:disabled):active,
  #fail button:not(:disabled):active { opacity: 0.75; }
  #fail button:disabled { opacity: 0.4; cursor: default; }

  /* 게이트·로딩 실패 차단막. #main 안에서만 덮고 뒤 내용은 블러로 비쳐 보이게 */
  #gate,
  #fail {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    text-align: center;
    background: var(--overlay);
    backdrop-filter: blur(6px);
  }
  #fail p {
    white-space: pre-wrap;
    word-break: break-all;
  }

  /* 하단 정보 줄. 차단막·게이트가 덮지 않는 영역 */
  #footer {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-top: 6px;
    height: 30px;
    padding: 0 14px;
    border-top: 1px solid var(--divider);
    font-size: 11px;
    color: var(--muted);
  }
  #footer a { color: var(--muted); text-decoration: none; }
  #footer a:hover { text-decoration: underline; }
  #footer .right {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  #dev-badge {
    padding: 1px 5px;
    border-radius: 4px;
    background: #ff9f0a;
    color: #fff;
    font-size: 9px;
    font-weight: 700;
    cursor: pointer;
  }
  #dev-badge.fail { background: #e0483e; }

  #settings-btn {
    display: inline-flex;
    padding: 0;
    border: none;
    background: none;
    color: var(--muted);
    cursor: pointer;
  }
  #settings-btn:hover { color: var(--fg); }
  #settings-btn svg { width: 14px; height: 14px; }

  dialog {
    border: 1px solid var(--divider);
    border-radius: 10px;
    background: var(--bg);
    color: var(--fg);
    padding: 14px;
  }
  dialog::backdrop { background: rgba(0, 0, 0, 0.35); }
  dialog h2 {
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    margin: 0 0 10px;
  }
  dialog button {
    padding: 6px 10px;
    border-radius: 7px;
    border: 1px solid var(--divider);
    background: transparent;
    color: var(--fg);
    font: inherit;
    cursor: pointer;
  }
  dialog button.on {
    border-color: var(--track-on);
    color: var(--track-on);
    font-weight: 600;
  }
  #dev-dialog button {
    display: block;
    width: 200px;
    padding: 6px 0;
  }
  #dev-dialog button + button { margin-top: 6px; }

  .opt-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 28px;
    min-width: 220px;
  }
  .opt-row + .opt-row { margin-top: 10px; }
  .opt-row select {
    padding: 4px 8px;
    border-radius: 7px;
    border: 1px solid var(--divider);
    background: var(--bg);
    color: var(--fg);
    font: inherit;
  }
  /* 바로가기 설정: 섹션 제목 + 2열 스위치. 섹션 사이는 구분선 */
  #shortcut-toggles { min-width: 300px; }
  .opt-caption {
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    margin: 0 0 8px;
  }
  .opt-grid + .opt-caption {
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px solid var(--divider);
  }
  .opt-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px 24px;
  }
  .opt-grid .opt-row {
    min-width: 0;
    gap: 12px;
  }

  #status {
    flex-shrink: 0;
    margin: 6px 14px 0;
    font-size: 11px;
    color: var(--muted);
    min-height: 14px;
    white-space: pre-wrap;
    word-break: break-all;
  }
  #status.error { color: #e0483e; }
</style>
</head>
<body>
  <div id="main">
    <div id="columns">
      <section class="panel" id="fav-panel">
        <h1>즐겨찾기<span id="fav-spin" class="spinner"></span></h1>
        <div id="favorites"></div>
        <section class="group" id="shortcut-group">
          <h1 class="group-head" id="shortcut-head"><span class="chev"></span>바로가기<button id="shortcut-settings-btn" class="head-btn" title="바로가기 설정"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14"/><circle cx="12" cy="5" r="2" style="fill:var(--bg)"/><circle cx="7" cy="10" r="2" style="fill:var(--bg)"/><circle cx="13" cy="15" r="2" style="fill:var(--bg)"/></svg></button></h1>
          <div id="shortcuts" class="rows"></div>
        </section>
        <div id="support">
          <a class="support-link" href="https://damoang.benecent.org/" target="_blank" rel="noopener">♡ 다모앙 후원하기<span class="arrow">→</span></a>
          <a class="support-link" href="https://forms.gle/Yj3D28THBxVNMWn2A" target="_blank" rel="noopener">♡ 마음메시지 신청하기<span class="arrow">→</span></a>
          <a class="support-link" href="https://damoang.net/brickang" target="_blank" rel="noopener">♡ 월별 후원 현황<span class="arrow">→</span></a>
        </div>
      </section>
      <section class="panel" id="settings">
        <div id="groups">
          <section class="group" id="memo-group">
            <h1 class="group-head" id="memo-head"><span class="chev"></span>메모 설정<span id="memo-spin" class="spinner"></span></h1>
            <div id="rows" class="rows"></div>
            <div class="actions group-actions">
              <button id="hide-all" disabled>전체 메모 가리기</button>
              <button id="show-all" disabled>전체 메모 표시</button>
            </div>
          </section>
        </div>
        <div class="actions" id="global-actions">
          <button id="apply" disabled>적용</button>
          <button id="refresh" disabled>새로고침</button>
        </div>
      </section>
    </div>
    <div id="gate" hidden>
      <p id="gate-msg"></p>
      <button id="gate-btn">다모앙 열기</button>
    </div>
    <div id="fail" hidden>
      <p id="fail-msg"></p>
      <button id="fail-btn">새로고침</button>
    </div>
    <div id="status">불러오는 중…</div>
  </div>
  <div id="footer">
    <a href="https://damoang-ui-extension.hobbyworker.me" target="_blank">웹사이트</a>
    <span class="right">
      <a id="version" target="_blank" rel="noopener"></a>
      <button id="settings-btn" title="설정"><svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" clip-rule="evenodd" d="M11.49 3.17c-.38-1.56-2.6-1.56-2.98 0a1.532 1.532 0 01-2.286.948c-1.372-.836-2.942.734-2.106 2.106.54.886.061 2.042-.947 2.287-1.561.379-1.561 2.6 0 2.978a1.532 1.532 0 01.947 2.287c-.836 1.372.734 2.942 2.106 2.106a1.532 1.532 0 012.287.947c.379 1.561 2.6 1.561 2.978 0a1.533 1.533 0 012.287-.947c1.372.836 2.942-.734 2.106-2.106a1.533 1.533 0 01.947-2.287c1.561-.379 1.561-2.6 0-2.978a1.532 1.532 0 01-.947-2.287c.836-1.372-.734-2.942-2.106-2.106a1.532 1.532 0 01-2.287-.947zM10 13a3 3 0 100-6 3 3 0 000 6z"/></svg></button>
      <span id="dev-badge" title="클릭: 테스트 항목" hidden>DEV</span>
    </span>
  </div>
  <dialog id="dev-dialog">
    <h2>테스트 항목</h2>
    <button data-sim="logout">비로그인</button>
    <button data-sim="fail">로딩 실패</button>
    <button data-sim="timeout">타임아웃</button>
    <button data-sim="">해제</button>
  </dialog>
  <dialog id="settings-dialog">
    <h2>설정</h2>
    <div class="opt-row">
      <label for="theme-select">화면모드</label>
      <select id="theme-select">
        <option value="system">시스템 따르기</option>
        <option value="light">주간 모드</option>
        <option value="dark">다크 모드</option>
      </select>
    </div>
    <div class="opt-row">
      <label for="debug-switch">디버그</label>
      <span class="switch">
        <input type="checkbox" id="debug-switch">
        <span class="track"></span>
      </span>
    </div>
  </dialog>
  <dialog id="shortcut-dialog">
    <h2>바로가기 설정</h2>
    <div id="shortcut-toggles"></div>
  </dialog>
  <script src="popup.js"></script>
</body>
</html>
