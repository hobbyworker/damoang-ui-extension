<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --fg: #1c1c1e;
    --muted: #8e8e93;
    --track-off: #d9d9de;
    --track-on: #34c759;
    --thumb: #ffffff;
    --divider: rgba(0, 0, 0, 0.06);
    --overlay: rgba(255, 255, 255, 0.45);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1e1e20;
      --fg: #f2f2f4;
      --muted: #98989e;
      --track-off: #3a3a3e;
      --divider: rgba(255, 255, 255, 0.08);
      --overlay: rgba(30, 30, 32, 0.5);
    }
  }
  /* 로딩 전후 팝업 크기가 출렁이지 않도록 고정. 내용이 넘치면 패널 안에서 스크롤 */
  body {
    width: 520px;
    height: 340px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    margin: 0;
    padding: 6px 0 0;
    background: var(--bg);
    color: var(--fg);
    font: 13px/1.4 -apple-system, "Apple SD Gothic Neo", "Pretendard", system-ui, sans-serif;
    user-select: none;
  }
  /* display 지정된 요소에서도 hidden이 우선하도록 */
  [hidden] { display: none !important; }
  h1 {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.04em;
    color: var(--muted);
    margin: 6px 14px 4px;
  }
  /* 팝업 상단부. 차단막은 이 영역까지만 덮고 하단 정보 줄은 남긴다 */
  #main {
    position: relative;
    display: flex;
    flex-direction: column;
    flex: 1;
    min-height: 0;
  }

  /* 좌우 패널. .panel을 추가하면 칼럼이 늘어난다 */
  #columns {
    display: flex;
    align-items: stretch;
    flex: 1;
    min-height: 0;
  }
  .panel {
    flex: 1 1 0;
    min-width: 0;
    overflow-y: auto;
  }
  .panel + .panel { border-left: 1px solid var(--divider); }

  .empty {
    padding: 7px 14px;
    color: var(--muted);
  }

  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 9px 14px;
  }
  .row + .row { border-top: 1px solid var(--divider); }
  .row label { flex: 1; cursor: pointer; }

  .switch { position: relative; display: inline-block; width: 34px; height: 20px; flex-shrink: 0; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch .track {
    position: absolute; inset: 0;
    background: var(--track-off);
    border-radius: 999px;
    transition: background 0.15s ease;
    cursor: pointer;
  }
  .switch .track::after {
    content: "";
    position: absolute; top: 2px; left: 2px;
    width: 16px; height: 16px;
    background: var(--thumb);
    border-radius: 50%;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.25);
    transition: transform 0.15s ease;
  }
  .switch input:checked + .track { background: var(--track-on); }
  .switch input:checked + .track::after { transform: translateX(14px); }
  .switch input:focus-visible + .track { outline: 2px solid var(--track-on); outline-offset: 2px; }
  .switch input:disabled + .track { opacity: 0.4; cursor: default; }

  /* 크기는 스위치 높이(20px)와 같게 잡아 교체 시 줄 높이가 안 흔들리게 */
  .spinner {
    display: inline-block;
    width: 16px;
    height: 16px;
    border: 2px solid var(--track-off);
    border-top-color: var(--muted);
    border-radius: 50%;
    animation: rotate 0.7s linear infinite;
    flex-shrink: 0;
  }
  h1 .spinner {
    width: 10px;
    height: 10px;
    margin-left: 6px;
    vertical-align: middle;
  }
  @keyframes rotate { to { transform: rotate(360deg); } }

  .fav {
    padding: 7px 14px;
    cursor: pointer;
  }
  .fav:hover { background: var(--divider); }
  .fav:active { opacity: 0.7; }

  .actions {
    display: flex;
    gap: 8px;
    margin: 10px 14px 0;
  }
  .actions + .actions { margin-top: 8px; }
  .actions button {
    flex: 1;
    padding: 6px 0;
    border-radius: 7px;
    border: 1px solid var(--divider);
    background: transparent;
    color: var(--fg);
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  #apply {
    background: var(--track-on);
    border-color: transparent;
    color: #fff;
  }
  .actions button:disabled { opacity: 0.4; cursor: default; }
  .actions button:not(:disabled):active { opacity: 0.75; }

  #gate p,
  #fail p {
    margin: 0 0 14px;
    color: var(--muted);
  }
  #gate button,
  #fail button {
    width: 240px;
    padding: 7px 0;
    border-radius: 7px;
    border: none;
    background: var(--track-on);
    color: #fff;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  #gate button:not(:disabled):active,
  #fail button:not(:disabled):active { opacity: 0.75; }
  #fail button:disabled { opacity: 0.4; cursor: default; }

  /* 게이트·로딩 실패 차단막. #main 안에서만 덮고 뒤 내용은 블러로 비쳐 보이게 */
  #gate,
  #fail {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    text-align: center;
    background: var(--overlay);
    backdrop-filter: blur(6px);
  }
  #fail p {
    white-space: pre-wrap;
    word-break: break-all;
  }

  /* 하단 정보 줄. 차단막·게이트가 덮지 않는 영역 */
  #footer {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-top: 6px;
    height: 30px;
    padding: 0 14px;
    border-top: 1px solid var(--divider);
    font-size: 11px;
    color: var(--muted);
  }
  #footer a { color: var(--muted); text-decoration: none; }
  #footer a:hover { text-decoration: underline; }
  #footer .right {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  #dev-badge {
    padding: 1px 5px;
    border-radius: 4px;
    background: #ff9f0a;
    color: #fff;
    font-size: 9px;
    font-weight: 700;
    cursor: pointer;
  }
  #dev-badge.fail { background: #e0483e; }

  #dev-dialog {
    border: 1px solid var(--divider);
    border-radius: 10px;
    background: var(--bg);
    color: var(--fg);
    padding: 14px;
  }
  #dev-dialog::backdrop { background: rgba(0, 0, 0, 0.35); }
  #dev-dialog h2 {
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    margin: 0 0 10px;
  }
  #dev-dialog button {
    display: block;
    width: 200px;
    padding: 6px 0;
    border-radius: 7px;
    border: 1px solid var(--divider);
    background: transparent;
    color: var(--fg);
    font: inherit;
    cursor: pointer;
  }
  #dev-dialog button + button { margin-top: 6px; }
  #dev-dialog button.on {
    border-color: var(--track-on);
    color: var(--track-on);
    font-weight: 600;
  }

  #status {
    flex-shrink: 0;
    margin: 6px 14px 0;
    font-size: 11px;
    color: var(--muted);
    min-height: 14px;
    white-space: pre-wrap;
    word-break: break-all;
  }
  #status.error { color: #e0483e; }
</style>
</head>
<body>
  <div id="main">
    <div id="columns">
      <section class="panel">
        <h1>즐겨찾기<span id="fav-spin" class="spinner"></span></h1>
        <div id="favorites"></div>
      </section>
      <section class="panel">
        <h1>메모 설정<span id="memo-spin" class="spinner"></span></h1>
        <div id="rows"></div>
        <div class="actions">
          <button id="apply" disabled>적용</button>
          <button id="refresh" disabled>새로고침</button>
        </div>
        <div class="actions">
          <button id="hide-all" disabled>전체 메모 가리기</button>
          <button id="show-all" disabled>전체 메모 표시</button>
        </div>
      </section>
    </div>
    <div id="gate" hidden>
      <p id="gate-msg"></p>
      <button id="gate-btn">다모앙 열기</button>
    </div>
    <div id="fail" hidden>
      <p id="fail-msg"></p>
      <button id="fail-btn">새로고침</button>
    </div>
    <div id="status">불러오는 중…</div>
  </div>
  <div id="footer">
    <a href="https://damoang-ui-extension.hobbyworker.me" target="_blank">웹사이트</a>
    <span class="right">
      <span id="version"></span>
      <span id="dev-badge" title="클릭: 테스트 항목" hidden>DEV</span>
    </span>
  </div>
  <dialog id="dev-dialog">
    <h2>테스트 항목</h2>
    <button data-sim="logout">비로그인</button>
    <button data-sim="fail">로딩 실패</button>
    <button data-sim="timeout">타임아웃</button>
    <button data-sim="">해제</button>
  </dialog>
  <script src="popup.js"></script>
</body>
</html>
